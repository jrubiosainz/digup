[project]
name = "contoso-support-agent"
version = "0.4.0"
description = "Contoso Outdoor's customer-support agent, on Microsoft Foundry Agent Service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects>=2.8.0",
    "azure-identity>=1.26.0",
    "azure-monitor-opentelemetry>=1.8.11",
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "openai>=3.24.0",
    "pyodbc>=5.3.0",
    "pypdf>=6.19.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
