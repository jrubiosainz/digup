<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A24A0"/><stop offset="1" stop-color="#140C3E"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="170" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6CFF" stop-opacity="0.5"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="900" cy="960" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C86BFA" stop-opacity="0.28"/><stop offset="1" stop-color="#C86BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="100" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E74FF"/><stop offset="0.25" stop-color="#A790FF"/><stop offset="0.42" stop-color="#C9BBFF"/><stop offset="0.52" stop-color="#DCD3FF"/><stop offset="0.64" stop-color="#BCA9FF"/><stop offset="0.82" stop-color="#8F74FF"/><stop offset="1" stop-color="#6040E8"/>
    </linearGradient>
    <linearGradient id="picture" x1="0" y1="388" x2="0" y2="636" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C6FC4"/><stop offset="1" stop-color="#33306E"/>
    </linearGradient>
    <clipPath id="frame"><rect x="386" y="388" width="204" height="248" rx="30"/></clipPath>
  </defs>
  <rect x="112" y="124" width="800" height="800" rx="180" fill="#000" opacity="0.32" filter="url(#drop)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
    <!-- Violet light from the top left and a little orchid low right: the app's backdrop, small. -->
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom)"/>
    <!-- The column: rows growing toward the open card, the lens. -->
    <rect x="400" y="236" width="360" height="30" rx="15" fill="#FFF" opacity="0.05"/>
    <rect x="408" y="240" width="22" height="22" rx="7" fill="#FFF" opacity="0.26"/>
    <rect x="442" y="246" width="170" height="10" rx="5" fill="#FFF" opacity="0.26"/>
    <rect x="380" y="290" width="400" height="46" rx="23" fill="#FFF" opacity="0.08"/>
    <rect x="390" y="295" width="36" height="36" rx="10" fill="#FFF" opacity="0.42"/>
    <rect x="442" y="306" width="208" height="14" rx="7" fill="#FFF" opacity="0.42"/>
    <rect x="380" y="688" width="400" height="46" rx="23" fill="#FFF" opacity="0.08"/>
    <rect x="390" y="693" width="36" height="36" rx="10" fill="#FFF" opacity="0.42"/>
    <rect x="442" y="704" width="208" height="14" rx="7" fill="#FFF" opacity="0.42"/>
    <rect x="400" y="758" width="360" height="30" rx="15" fill="#FFF" opacity="0.05"/>
    <rect x="408" y="762" width="22" height="22" rx="7" fill="#FFF" opacity="0.26"/>
    <rect x="442" y="768" width="170" height="10" rx="5" fill="#FFF" opacity="0.26"/>
    <rect x="360" y="376" width="440" height="300" rx="52" fill="#000" opacity="0.4" filter="url(#soft)"/>
    <rect x="360" y="362" width="440" height="300" rx="52" fill="#F5F3FD"/>
    <g clip-path="url(#frame)">
      <rect x="386" y="388" width="204" height="248" fill="url(#picture)"/>
      <circle cx="540" cy="446" r="22" fill="#F6F1FF" opacity="0.92"/>
      <path d="M386 590 L450 522 L494 566 L522 540 L590 602 V636 H386 Z" fill="#8F8FD8"/>
      <path d="M386 636 V612 L432 584 L486 636 Z" fill="#B9B6EC"/>
    </g>
    <rect x="616" y="406" width="156" height="24" rx="12" fill="#231D45"/>
    <rect x="616" y="452" width="110" height="20" rx="10" fill="#6A4BF2"/>
    <rect x="616" y="494" width="136" height="16" rx="8" fill="#CEC8E6"/>
    <rect x="616" y="526" width="90" height="16" rx="8" fill="#CEC8E6"/>
    <!-- Biblo's ribbon, hanging from the top edge, brightest beside the card it marks. -->
    <path transform="translate(10 8)" d="M240 60 H328 V800 L284 752 L240 800 Z" fill="#000" opacity="0.4" filter="url(#soft)"/>
    <path d="M240 60 H328 V800 L284 752 L240 800 Z" fill="url(#ribbon)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
</svg>
