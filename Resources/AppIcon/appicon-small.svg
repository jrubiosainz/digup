<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A24A0"/><stop offset="1" stop-color="#140C3E"/>
    </linearGradient>
    <radialGradient id="glow" cx="300" cy="170" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6CFF" stop-opacity="0.5"/><stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="900" cy="960" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C86BFA" stop-opacity="0.28"/><stop offset="1" stop-color="#C86BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="100" x2="0" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A82FF"/><stop offset="0.5" stop-color="#DCD3FF"/><stop offset="1" stop-color="#6A4BF2"/>
    </linearGradient>
  </defs>
  <rect x="112" y="124" width="800" height="800" rx="180" fill="#000" opacity="0.32" filter="url(#drop)"/>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
    <!-- Violet light from the top left and a little orchid low right: the app's backdrop, small. -->
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom)"/>
    <!-- Small sizes: the card, its picture and the two rows next to it, no glyphs. -->
    <rect x="380" y="262" width="420" height="56" rx="28" fill="#FFF" opacity="0.36"/>
    <rect x="380" y="706" width="420" height="56" rx="28" fill="#FFF" opacity="0.36"/>
    <rect x="356" y="350" width="468" height="324" rx="62" fill="#F5F3FD"/>
    <rect x="390" y="384" width="214" height="256" rx="36" fill="#4B4A8E"/>
    <rect x="634" y="406" width="150" height="34" rx="17" fill="#6A4BF2"/>
    <!-- The ribbon, wider so it holds at 16 px. -->
    <path d="M206 60 H326 V820 L266 756 L206 820 Z" fill="url(#ribbon)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
</svg>
